<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Galeria de fotos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Galeria</ion-title>
    </ion-toolbar>
  </ion-header>

<div id="container">

  <!-- Primeiro perfil, perfil do Rick -->
  <div class="perfil-card">
      <div class="perfil">

        <ion-avatar class="foto-perfil">
          <img
            alt="Foto de perfil"
            src="assets/rk_ft.JPG"
          />
        </ion-avatar>

        <div class="informacoes">
          <div class="nome">
            Henrique Rodrigues Silva
          </div>

          <div class="descricao">
            Um desenvolvedor front-end em busca de sempre melhorar
          </div>
        </div>

      </div>

      <div class="lista">
        <ion-list [inset]="true">
          <ion-item>
            <ion-label> <ion-icon name="square" color="secondary"></ion-icon> Tocar Piano</ion-label>
          </ion-item>
          <ion-item>
            <ion-label> <ion-icon name="square" color="secondary"></ion-icon> Jogar Videogame</ion-label>
          </ion-item>
        </ion-list>

        <ion-list [inset]="true">
          <ion-item>
            <ion-label> <ion-icon name="square" color="secondary"></ion-icon> Ler livros</ion-label>
          </ion-item>
          <ion-item>
            <ion-label> <ion-icon name="square" color="secondary"></ion-icon> Ver Séries</ion-label>
          </ion-item>
        </ion-list>
      </div>


      <ion-grid class="galeria">
        <ion-row>

          <!-- Foto principal -->
          <ion-col size="7">
            <img src="" alt="Foto principal">
          </ion-col>

          <!-- Fotos menores -->
          <ion-col size="5">

            <div class="foto-pequena">
              <img src="" alt="Foto 2">
            </div>

            <div class="foto-pequena">
              <img src="" alt="Foto 3">
            </div>

          </ion-col>


        </ion-row>

        <ion-row>
            <ion-col size="4">
              <img src="" alt="Foto 4">
            </ion-col>

            <ion-col size="8">
              <img src="" alt="Foto 5">
            </ion-col>
        </ion-row>

      </ion-grid>

  </div> 

  <!--- outro card de perfil -->

    <div class="perfil-card">
      <div class="perfil">

        <ion-avatar class="foto-perfil">
          <img
            alt="Foto de perfil"
            src="https://ionicframework.com/docs/img/demos/avatar.svg"
          />
        </ion-avatar>

        <div class="informacoes">
          <div class="nome">
            Nome do integrante
          </div>

          <div class="descricao">
            Descrição do integrante
          </div>
        </div>

      </div>

      <div class="lista">
        <ion-list [inset]="true">
          <ion-item>
            <ion-label> <ion-icon name="square" color="secondary"></ion-icon>Pokémon Yellow</ion-label>
          </ion-item>
          <ion-item>
            <ion-label> <ion-icon name="square" color="secondary"></ion-icon>Mega Man X</ion-label>
          </ion-item>
        </ion-list>

        <ion-list [inset]="true">
          <ion-item>
            <ion-label> <ion-icon name="square" color="secondary"></ion-icon>Pac-Man</ion-label>
          </ion-item>
          <ion-item>
            <ion-label> <ion-icon name="square" color="secondary"></ion-icon>Super Mario World</ion-label>
          </ion-item>
        </ion-list>
      </div>


      <ion-grid class="galeria">
        <ion-row>

          <!-- Foto principal -->
          <ion-col size="7">
            <img src="" alt="Foto principal">
          </ion-col>

          <!-- Fotos menores -->
          <ion-col size="5">

            <div class="foto-pequena">
              <img src="" alt="Foto 2">
            </div>

            <div class="foto-pequena">
              <img src="" alt="Foto 3">
            </div>

          </ion-col>


        </ion-row>

        <ion-row>
            <ion-col size="4">
              <img src="" alt="Foto 4">
            </ion-col>

            <ion-col size="8">
              <img src="" alt="Foto 5">
            </ion-col>
        </ion-row>

      </ion-grid>

  </div> 

</div>


</ion-content>
