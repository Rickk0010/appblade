<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>
      Login para Galeria
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">

    <div id="conteudo">
        <ion-chip>
          <ion-avatar>
            <img alt="Foto de perfil" src="https://ionicframework.com/docs/img/demos/avatar.svg" />
          </ion-avatar>
          <ion-label>Usuário</ion-label>
        </ion-chip>
        
          <ion-input label="Login: " placeholder="email@email.com" type="email" fill="outline" [clearInput]="true" labelPlacement="floating"></ion-input>
        
          <ion-input label="Senha: " placeholder="********" type="password" fill="outline" labelPlacement="floating"> </ion-input>
                
          <ion-button expand="block" color="primary" routerLink="/galeria">Entrar</ion-button>
    </div>

  </div>
      
</ion-content>
